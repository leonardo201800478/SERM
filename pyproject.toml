# SERM repository workspace configuration.
#
# The active Python project lives in v2/ and has its own pyproject.toml.
# This root file exists only so repository-level tooling does not discover
# the historical V1 application as the active project.

[tool.pytest.ini_options]
testpaths = ["v2/tests"]
pythonpath = ["v2"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.ruff]
# Restrict repository-root Ruff discovery to the active V2 tree.
include = ["v2/**/*.py"]
exclude = [
    ".git",
    ".venv",
    "v2/.venv",
    "build",
    "dist",
]
