[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mame-set-builder"
version = "0.1.0"
description = "Gerenciador e construtor de sets personalizados de MAME"
readme = "README.md"
authors = [
    {name = "Leonardo", email = "leonardo201800478@example.com"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 2 - Pre-Alpha"
]
requires-python = ">=3.10"
dependencies = [
    "py7zr>=0.20.0",          # Suporte a 7Z
    "qbittorrent-api>=2024.6.0", # Integração com qBittorrent (API REST)
    "requests>=2.31.0",       # Requerido pela qbittorrent-api
    "click>=8.1.0",           # CLI (opcional, mas útil)
    "tqdm>=4.66.0", 
    "chardet>=5.0.0",          # Progresso nas operações
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "types-requests>=2.31.0",
]
gui = [
    "PyQt6>=6.7.0",           # Interface gráfica (futuro)
]
torrent = [
    "qbittorrent-api>=2024.6.0",
    "requests>=2.31.0",
]
all = [
    "mame-set-builder[dev,gui,torrent]",
]

[project.urls]
Homepage = "https://github.com/leonardo201800478/mame-set-builder"
Issues = "https://github.com/leonardo201800478/mame-set-builder/issues"

[project.scripts]
mame-set-builder = "mame_set_builder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mame_set_builder*"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=mame_set_builder --cov-report=term-missing"