name: Temporary Pylance Fix MAME

on:
  push:
    paths:
      - .github/workflows/temporary-pylance-fix-mame.yml

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        shell: python
        run: |
          from pathlib import Path
          p = Path("v2/serm_v2/gui/mame_advanced_filters_dialog.py")
          text = p.read_text(encoding="utf-8")
          text = text.replace("from typing import Any\n\n", "")
          text = text.replace("str(sum(int(c[\"machines\"]) for c in children))", "str(sum(int(str(c[\"machines\"])) for c in children))")
          p.write_text(text, encoding="utf-8")
      - name: Validate
        run: python -m compileall -q v2/serm_v2
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/serm_v2
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(v2): corrigir tipo do contador CATLIST [skip ci]"
          git push
