name: ARES v148 firmware correction

on:
  push:
    branches: [fix/ares-v148-firmware]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply ARES v148 firmware policy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          service = Path('serm_v2/services/ares_firmware_service.py')
          text = service.read_text(encoding='utf-8')

          text = text.replace(
              'ARES_SOURCE_REVISION = "4cb8d92b441557cb6bcaf133c4cbc7f6819b1122"',
              'ARES_SOURCE_REVISION = "0aafd85789215e84e1e43415c07d4c88461b7899"',
          )

          text = re.sub(
              r'\n        \{"system": "Saturn",.*?"source_path": "desktop-ui/emulator/saturn\\.cpp"\},',
              '',
              text,
              flags=re.S,
          )
          text = re.sub(
              r'\n        \{"system": "Atari 5200",.*?"source_path": "desktop-ui/emulator/atari-5200\\.cpp"\},',
              '',
              text,
          )

          text = text.replace(
              '{"system": "Neo Geo AES", "name": "neo-epo.bin", "region": "World", "container_name": "neogeo.zip", "source_path": "mia/system/neo-geo-aes.cpp"},',
              '{"system": "Neo Geo AES", "name": "neo-epo.bin", "region": "World", "sha256": "70f7906d68acbc3630b6e7792ebb485288b05ca72c6d4c243e07e230aae8d1e4", "container_name": "neogeo.zip", "source_path": "desktop-ui/emulator/neo-geo-aes.cpp"},',
          )
          text = text.replace(
              '{"system": "Neo Geo MVS", "name": "sp-45.sp1", "region": "World", "container_name": "neogeo.zip", "source_path": "mia/system/neo-geo-mvs.cpp"},',
              '{"system": "Neo Geo MVS", "name": "sp-45.sp1", "region": "World", "sha256": "0fbeee82b463187d6360e92811f1fad58649feb8ab2584c524222d0b5bf53a17", "container_name": "neogeo.zip", "source_path": "desktop-ui/emulator/neo-geo-mvs.cpp"},',
          )

          marker = '''    @classmethod\n    def _read_firmware_assignments('''
          injected = '''    @classmethod\n    def _auto_assign_neo_geo_settings(\n        cls, matches: tuple[AresFirmwareMatch, ...]\n    ) -> None:\n        """Configura automaticamente AES/MVS no settings.bml quando há arquivos soltos válidos.\n\n        O ARES v148 expõe Neo Geo AES e MVS como BIOS/World e exige o apontamento\n        manual pelo menu Firmware. Arquivos dentro de neogeo.zip não são atribuídos\n        automaticamente porque o carregador do ARES extrai o primeiro membro do ZIP,\n        o que não é seguro para distinguir AES de MVS.\n        """\n        settings = cls.configured_settings_path()\n        if settings is None:\n            return\n\n        targets: dict[str, str] = {}\n        for match in matches:\n            if match.archive_member is not None:\n                continue\n            if match.entry.system not in {"Neo Geo AES", "Neo Geo MVS"}:\n                continue\n            if match.entry.name not in {"neo-epo.bin", "sp-45.sp1"}:\n                continue\n            targets[match.entry.system] = str(Path(match.path).resolve())\n\n        if not targets:\n            return\n\n        try:\n            lines = settings.read_text(encoding="utf-8").splitlines()\n        except OSError:\n            return\n\n        def find_block(name: str) -> tuple[int, int] | None:\n            start = None\n            for index, line in enumerate(lines):\n                if line.strip() == f"{name}:" and len(line) - len(line.lstrip()) == 0:\n                    start = index\n                    break\n            if start is None:\n                return None\n            end = len(lines)\n            for index in range(start + 1, len(lines)):\n                if lines[index].strip() and len(lines[index]) - len(lines[index].lstrip()) == 0:\n                    end = index\n                    break\n            return start, end\n\n        changed = False\n        for system, location in targets.items():\n            block = find_block(system)\n            if block is None:\n                if lines and lines[-1].strip():\n                    lines.append("")\n                lines.extend((f"{system}:", "  Firmware:", f'    BIOS.World: "{location}"'))\n                changed = True\n                continue\n\n            start, end = block\n            firmware_index = None\n            for index in range(start + 1, end):\n                if lines[index].strip() == "Firmware:" and len(lines[index]) - len(lines[index].lstrip()) == 2:\n                    firmware_index = index\n                    break\n            if firmware_index is None:\n                lines[start + 1:start + 1] = ["  Firmware:"]\n                firmware_index = start + 1\n                end += 1\n                changed = True\n\n            assignment = f'    BIOS.World: "{location}"'\n            replaced = False\n            for index in range(firmware_index + 1, end):\n                if lines[index].strip().startswith("BIOS.World:") and len(lines[index]) - len(lines[index].lstrip()) == 4:\n                    if lines[index] != assignment:\n                        lines[index] = assignment\n                        changed = True\n                    replaced = True\n                    break\n            if not replaced:\n                insert_at = firmware_index + 1\n                while insert_at < len(lines) and lines[insert_at].strip() and len(lines[insert_at]) - len(lines[insert_at].lstrip()) >= 4:\n                    insert_at += 1\n                lines.insert(insert_at, assignment)\n                changed = True\n\n        if changed:\n            backup = settings.with_suffix(settings.suffix + '.bak')\n            try:\n                if not backup.exists():\n                    backup.write_text(settings.read_text(encoding="utf-8"), encoding="utf-8")\n                settings.write_text("\\n".join(lines) + "\\n", encoding="utf-8")\n            except OSError:\n                return\n\n    @classmethod\n    def _read_firmware_assignments('''
          if marker not in text:
              raise SystemExit('ARES insertion marker not found')
          text = text.replace(marker, injected, 1)

          scan_marker = '''        matches = tuple(found[key] for key in sorted(found))\n        matched_names = set(found)'''
          scan_replacement = '''        matches = tuple(found[key] for key in sorted(found))\n        if emulator.casefold() == "ares":\n            cls._auto_assign_neo_geo_settings(matches)\n        matched_names = set(found)'''
          if scan_marker not in text:
              raise SystemExit('ARES scan marker not found')
          text = text.replace(scan_marker, scan_replacement, 1)

          service.write_text(text, encoding='utf-8')

          tests = Path('tests/test_retro_bios_firmware_service.py')
          test_text = tests.read_text(encoding='utf-8')
          test_text = test_text.replace(
              '    assert len(entries) == 39\n    assert sum(entry.is_verifiable for entry in entries) == 34',
              '    assert len(entries) == 35\n    assert sum(entry.is_verifiable for entry in entries) == 35',
          )
          old_saturn = '''    assert {\n        (entry.system, entry.region)\n        for entry in entries\n        if entry.system == "Saturn"\n    } == {\n        ("Saturn", "US"),\n        ("Saturn", "Japan"),\n        ("Saturn", "Europe"),\n    }'''
          new_saturn = '''    assert all(entry.system != "Saturn" for entry in entries)\n    assert all(entry.system != "Atari 5200" for entry in entries)\n    neo = {entry.system: entry for entry in entries if entry.system in {"Neo Geo AES", "Neo Geo MVS"}}\n    assert neo["Neo Geo AES"].sha256 == "70f7906d68acbc3630b6e7792ebb485288b05ca72c6d4c243e07e230aae8d1e4"\n    assert neo["Neo Geo MVS"].sha256 == "0fbeee82b463187d6360e92811f1fad58649feb8ab2584c524222d0b5bf53a17"'''
          if old_saturn not in test_text:
              raise SystemExit('ARES source test marker not found')
          test_text = test_text.replace(old_saturn, new_saturn, 1)

          addition_marker = '''def test_ares_destination_scan_validates_physical_destination_files('''
          new_test = '''def test_ares_scan_auto_assigns_loose_neo_geo_bios_to_settings(tmp_path: Path, monkeypatch: pytest.MonkeyPatch) -> None:\n    source = tmp_path / "source"\n    source.mkdir()\n    aes = source / "neo-epo.bin"\n    mvs = source / "sp-45.sp1"\n    aes.write_bytes(b"aes")\n    mvs.write_bytes(b"mvs")\n\n    entries = (\n        AresFirmwareEntry(\n            name="neo-epo.bin", system="Neo Geo AES", description="", required=True,\n            sha256=hashlib.sha256(b"aes").hexdigest(), region="World", profile_id="ares-source"\n        ),\n        AresFirmwareEntry(\n            name="sp-45.sp1", system="Neo Geo MVS", description="", required=True,\n            sha256=hashlib.sha256(b"mvs").hexdigest(), region="World", profile_id="ares-source"\n        ),\n    )\n    settings = tmp_path / "settings.bml"\n    settings.write_text("Paths:\\n  Firmware: \\\"Firmware\\\"\\n", encoding="utf-8")\n    monkeypatch.setattr(AresFirmwareService, "configured_settings_path", classmethod(lambda cls: settings))\n\n    result = AresFirmwareService.scan(source, entries, emulator="ares")\n\n    assert len(result.matches) == 2\n    text = settings.read_text(encoding="utf-8")\n    assert 'Neo Geo AES:' in text\n    assert 'Neo Geo MVS:' in text\n    assert 'BIOS.World: "' in text\n    assert str(aes.resolve()) in text\n    assert str(mvs.resolve()) in text\n    assert settings.with_suffix(settings.suffix + ".bak").exists()\n\n\n'''
          if addition_marker not in test_text:
              raise SystemExit('ARES test insertion marker not found')
          test_text = test_text.replace(addition_marker, new_test + addition_marker, 1)
          tests.write_text(test_text, encoding='utf-8')
          PY

          rm -f .github/workflows/ares-v148-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ares): align firmware catalog and settings with v148'
          git push origin HEAD:fix/ares-v148-firmware
