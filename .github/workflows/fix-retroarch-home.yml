name: Fix RetroArch Home

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix(gui): disponibilizar downloads Stable e Nightly do RetroArch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correção
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manager_path = Path('v2/serm_v2/services/emulator_manager.py')
          manager = manager_path.read_text(encoding='utf-8')
          marker = '    @classmethod\n    def detect_7zip(cls) -> Path | None:\n'
          if '    def install_frontend(\n' not in manager:
              method = '''    def install_frontend(\n        self,\n        destination: Path,\n        *,\n        channel: str = "stable",\n        progress=None,\n        log=None,\n    ) -> DownloadResult:\n        """Baixa e instala o frontend RetroArch x64 Stable ou Nightly."""\n        channel = channel.casefold().strip()\n        if channel not in {"stable", "nightly"}:\n            raise ValueError(f"Canal RetroArch inválido: {channel!r}")\n\n        destination = Path(destination).expanduser().resolve()\n        destination.mkdir(parents=True, exist_ok=True)\n\n        if channel == "stable":\n            version = self.latest_stable_version()\n            root, _ = self.buildroot("stable", version)\n            archive_name = self.RETROARCH_ARCHIVE\n            url = f"{root}{archive_name}"\n            version_label = version\n        else:\n            archive_name, url = self.discover_nightly_archive()\n            version_label = f"nightly-{archive_name[:10]}"\n\n        temp_dir = Path(tempfile.mkdtemp(prefix="serm-retroarch-"))\n        archive = temp_dir / archive_name\n        extracted = temp_dir / "extracted"\n        extracted.mkdir()\n        try:\n            if log:\n                log(\n                    f"RETROARCH | canal={channel} | versão={version_label} | "\n                    f"arquivo={archive_name}"\n                )\n                log(f"DOWNLOAD | {url}")\n            self._download_file(url, archive, progress, log)\n            self._extract(archive, extracted, log)\n            self._merge(extracted, destination)\n        finally:\n            shutil.rmtree(temp_dir, ignore_errors=True)\n\n        executable = next(\n            (path.resolve() for path in destination.rglob("retroarch.exe") if path.is_file()),\n            None,\n        )\n        if executable is None:\n            raise RuntimeError(\n                f"Download concluído, mas retroarch.exe não foi encontrado em {destination}."\n            )\n\n        if log:\n            log(\n                f"RETROARCH | instalado | canal={channel} | versão={version_label} | "\n                f"exe={executable}"\n            )\n        return DownloadResult("retroarch", version_label, executable, archive_name)\n\n'''
              if marker not in manager:
                  raise SystemExit('Ponto de inserção do RetroArch não encontrado.')
              manager = manager.replace(marker, method + marker, 1)
              manager_path.write_text(manager, encoding='utf-8')

          home_path = Path('v2/serm_v2/gui/emulator_home.py')
          home = home_path.read_text(encoding='utf-8')
          old_actions = '''        actions = QHBoxLayout()\n        for text, slot in (\n            ("⬇ Instalar / atualizar", self.install_retroarch),\n            ("📁 Diretório", self.configure_retroarch),\n            ("🔄 Buscar cores", self.refresh_cores),\n            ("🔎 Verificar atualizações", self.verify_core_updates),\n        ):\n            button = QPushButton(text)\n            button.clicked.connect(slot)\n            actions.addWidget(button)\n        layout.addLayout(actions)\n'''
          new_actions = '''        actions = QHBoxLayout()\n        for text, channel in (\n            ("⬇ Baixar / atualizar Stable", "stable"),\n            ("⬇ Baixar / atualizar Nightly", "nightly"),\n        ):\n            button = QPushButton(text)\n            button.clicked.connect(lambda _=False, c=channel: self.install_retroarch(c))\n            actions.addWidget(button)\n        for text, slot in (\n            ("📁 Diretório", self.configure_retroarch),\n            ("🔄 Buscar cores", self.refresh_cores),\n            ("🔎 Verificar atualizações", self.verify_core_updates),\n        ):\n            button = QPushButton(text)\n            button.clicked.connect(slot)\n            actions.addWidget(button)\n        layout.addLayout(actions)\n'''
          if old_actions in home:
              home = home.replace(old_actions, new_actions, 1)
          elif 'Baixar / atualizar Stable' not in home:
              raise SystemExit('Bloco de ações RetroArch não encontrado.')

          old_install = '''    def install_retroarch(self) -> None:\n        """Instala/atualiza RetroArch no canal Stable ou Nightly selecionado."""\n        destination = self.manager.roots.get("retroarch")\n        if not destination:\n            selected = QFileDialog.getExistingDirectory(\n                self, "Instalar RetroArch em", str(Path.home())\n            )\n            if not selected:\n                return\n            destination = Path(selected).resolve()\n            paths = self._load_paths()\n            paths["retroarch"] = destination\n            self._save_paths(paths)\n        self.retroarch = RetroArchManager(destination)\n        self._start_retro(\n            lambda progress, log: self.retroarch.install_core(\n                "", destination, channel=self._retro_channel, progress=progress, log=log\n            )\n        )\n'''
          new_install = '''    def install_retroarch(self, channel: str | None = None) -> None:\n        """Instala/atualiza o frontend RetroArch Stable ou Nightly."""\n        channel = (channel or self._retro_channel).casefold()\n        if channel not in {"stable", "nightly"}:\n            raise ValueError(f"Canal RetroArch inválido: {channel!r}")\n        if self.worker is not None:\n            self._append_retro_log("AVISO | já existe uma operação do RetroArch em execução.")\n            return\n\n        destination = self.manager.roots.get("retroarch")\n        if not destination:\n            selected = QFileDialog.getExistingDirectory(\n                self, f"Instalar RetroArch {channel.title()} em", str(Path.home())\n            )\n            if not selected:\n                return\n            destination = Path(selected).resolve()\n\n        paths = self._load_paths()\n        paths["retroarch"] = Path(destination).resolve()\n        paths["retroarch_channel"] = Path(channel)\n        self._save_paths(paths)\n        self.manager.roots = paths\n        self.retroarch = RetroArchManager(Path(destination))\n        self._retro_channel = channel\n        self._append_retro_log(\n            f"DOWNLOAD | RetroArch | canal={channel} | destino={Path(destination).resolve()}"\n        )\n        self._start_retro(\n            lambda progress, log, c=channel, d=Path(destination): self.retroarch.install_frontend(\n                d, channel=c, progress=progress, log=log\n            )\n        )\n'''
          if old_install in home:
              home = home.replace(old_install, new_install, 1)
          elif 'def install_retroarch(self, channel: str | None = None)' not in home:
              raise SystemExit('Método install_retroarch não encontrado.')

          old_done = '''    def _retro_done(self, result) -> None:\n        """Registra sucesso da operação RetroArch."""\n        self._append_retro_log(f"OK | {result}")\n'''
          new_done = '''    def _retro_done(self, result) -> None:\n        """Registra sucesso e persiste a instalação do frontend RetroArch."""\n        executable = getattr(result, "executable", None)\n        version = getattr(result, "version", None)\n        archive = getattr(result, "archive", None)\n        if executable and version:\n            executable_path = Path(executable).resolve()\n            paths = self._load_paths()\n            paths["retroarch"] = executable_path.parent\n            paths["retroarch_exe"] = executable_path\n            paths["retroarch_version"] = Path(str(version))\n            if archive:\n                paths["retroarch_archive"] = Path(str(archive))\n            self._save_paths(paths)\n            self._persist_version_marker(executable_path, str(version), str(archive or ""))\n        self._append_retro_log(f"OK | {result}")\n'''
          if old_done in home:
              home = home.replace(old_done, new_done, 1)
          elif 'persiste a instalação do frontend RetroArch' not in home:
              raise SystemExit('Método _retro_done não encontrado.')

          home_path.write_text(home, encoding='utf-8')
          print('Correção aplicada.')
          PY
      - name: Validar sintaxe
        run: python3 -m compileall -q v2/serm_v2
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/serm_v2/services/emulator_manager.py v2/serm_v2/gui/emulator_home.py
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "fix(gui): disponibilizar downloads Stable e Nightly do RetroArch"
          git push
