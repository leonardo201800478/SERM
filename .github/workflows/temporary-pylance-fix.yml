name: Temporary Pylance Fix

on:
  push:
    paths:
      - .github/workflows/temporary-pylance-fix.yml

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"pattern not found: {path}: {old!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace("v2/serm_v2/gui/emulator_settings_page.py", '            widget._serm_slider = slider\n            widget._serm_spin = spin  # type: ignore[attr-defined]\n', '            setattr(widget, "_serm_slider", slider)\n            setattr(widget, "_serm_spin", spin)\n')
          replace("v2/serm_v2/gui/emulator_settings_page.py", '            control._serm_slider.setValue(number)\n            control._serm_spin.setValue(number)  # type: ignore[attr-defined]\n', '            slider = getattr(control, "_serm_slider", None)\n            spin = getattr(control, "_serm_spin", None)\n            if isinstance(slider, QSlider) and isinstance(spin, QSpinBox):\n                slider.setValue(number)\n                spin.setValue(number)\n')
          replace("v2/serm_v2/gui/emulator_settings_page.py", '            return str(control._serm_spin.value())  # type: ignore[attr-defined]\n', '            spin = getattr(control, "_serm_spin", None)\n            return str(spin.value()) if isinstance(spin, QSpinBox) else "0"\n')

          replace("v2/serm_v2/gui/main_window.py", '        if hasattr(page, "refresh"):\n            page.refresh()\n', '        refresh = getattr(page, "refresh", None)\n        if callable(refresh):\n            refresh()\n')

          replace("v2/serm_v2/gui/scan_phase_page.py", 'import re\nfrom dataclasses import dataclass\nfrom pathlib import Path\nfrom typing import Any\n', 'import re\nfrom dataclasses import dataclass\nfrom pathlib import Path\nfrom typing import Any, cast\n')
          replace("v2/serm_v2/gui/scan_phase_page.py", '        path = ScanRepository(database_path()).raw_file(result.scan_id)\n', '        completed_result = cast(Any, result)\n        path = ScanRepository(database_path()).raw_file(completed_result.scan_id)\n')
          replace("v2/serm_v2/gui/scan_phase_page.py", '        for index in range(self.tabs.count()):\n            widget = self.tabs.widget(index)\n            if hasattr(widget, "refresh"):\n                widget.refresh()\n', '        for index in range(self.tabs.count()):\n            widget = self.tabs.widget(index)\n            refresh = getattr(widget, "refresh", None) if widget is not None else None\n            if callable(refresh):\n                refresh()\n')

          replace("v2/serm_v2/gui/filter_phase_page.py", '        for page in self.pages:\n            if hasattr(page, "refresh"):\n                page.refresh()\n', '        for page in self.pages:\n            refresh = getattr(page, "refresh", None)\n            if callable(refresh):\n                refresh()\n')

          replace("v2/serm_v2/gui/filter_profiles_page.py", 'from uuid import uuid4\n', 'from typing import Any\nfrom uuid import uuid4\n')
          replace("v2/serm_v2/gui/filter_profiles_page.py", '        self.catalog_estimate.setText(\n            f"ROMs selecionadas: {int(estimate[\'roms\']):,}  •  máquinas: {int(estimate[\'machines\']):,}"\n        )\n        details = (\n            f"Opcionais: {int(estimate[\'optional_roms\']):,}  •  CHDs/disks: {int(estimate[\'disks\']):,}  •  "\n            f"SET: {estimate.get(\'set_type\', \'split\')}  •  catálogo total: {int(estimate[\'catalog_roms\']):,} ROMs"\n        )\n', '        def as_int(value: object) -> int:\n            if value is None:\n                return 0\n            try:\n                return int(value)\n            except (TypeError, ValueError):\n                return 0\n\n        self.catalog_estimate.setText(\n            f"ROMs selecionadas: {as_int(estimate.get(\'roms\')):,}  •  máquinas: {as_int(estimate.get(\'machines\')):,}"\n        )\n        details = (\n            f"Opcionais: {as_int(estimate.get(\'optional_roms\')):,}  •  CHDs/disks: {as_int(estimate.get(\'disks\')):,}  •  "\n            f"SET: {estimate.get(\'set_type\', \'split\')}  •  catálogo total: {as_int(estimate.get(\'catalog_roms\')):,} ROMs"\n        )\n')
          replace("v2/serm_v2/gui/filter_profiles_page.py", '            root = self.source_tree.topLevelItem(i)\n            candidates = [root] + [root.child(n) for n in range(root.childCount())]\n            for item in candidates:\n', '            root = self.source_tree.topLevelItem(i)\n            if root is None:\n                continue\n            candidates = [root]\n            for n in range(root.childCount()):\n                child = root.child(n)\n                if child is not None:\n                    candidates.append(child)\n            for item in candidates:\n')
          replace("v2/serm_v2/gui/filter_profiles_page.py", '        if self.source_tree.topLevelItemCount():\n            self.source_tree.setCurrentItem(self.source_tree.topLevelItem(0))\n', '        if self.source_tree.topLevelItemCount():\n            first_item = self.source_tree.topLevelItem(0)\n            if first_item is not None:\n                self.source_tree.setCurrentItem(first_item)\n')
          replace("v2/serm_v2/gui/filter_profiles_page.py", '        parent = next(\n            (\n                self.source_tree.topLevelItem(i)\n                for i in range(self.source_tree.topLevelItemCount())\n                if self.source_tree.topLevelItem(i).text(0) == source\n            ),\n            None,\n        )\n', '        parent = None\n        for i in range(self.source_tree.topLevelItemCount()):\n            candidate = self.source_tree.topLevelItem(i)\n            if candidate is not None and candidate.text(0) == source:\n                parent = candidate\n                break\n')

          replace("v2/serm_v2/gui/mame_advanced_filters_dialog.py", 'from __future__ import annotations\n\nfrom PySide6.QtCore', 'from __future__ import annotations\n\nfrom typing import Any\n\nfrom PySide6.QtCore')
          replace("v2/serm_v2/gui/mame_advanced_filters_dialog.py", '            parent = self.tree.topLevelItem(i)\n            parent_match = needle in parent.text(0).casefold()\n', '            parent = self.tree.topLevelItem(i)\n            if parent is None:\n                continue\n            parent_match = needle in parent.text(0).casefold()\n')
          replace("v2/serm_v2/gui/mame_advanced_filters_dialog.py", '                child = parent.child(j)\n                match = parent_match or needle in child.text(0).casefold()\n                child.setHidden(not match)\n', '                child = parent.child(j)\n                if child is None:\n                    continue\n                match = parent_match or needle in child.text(0).casefold()\n                child.setHidden(not match)\n')
          replace("v2/serm_v2/gui/mame_advanced_filters_dialog.py", '            parent = self.tree.topLevelItem(i)\n            if not parent.isHidden():\n', '            parent = self.tree.topLevelItem(i)\n            if parent is None:\n                continue\n            if not parent.isHidden():\n')
          replace("v2/serm_v2/gui/mame_advanced_filters_dialog.py", '                    child = parent.child(j)\n                    if not child.isHidden():\n', '                    child = parent.child(j)\n                    if child is None:\n                        continue\n                    if not child.isHidden():\n')
          replace("v2/serm_v2/gui/mame_advanced_filters_dialog.py", '            parent = self.tree.topLevelItem(i)\n            parent.setCheckState(0, Qt.CheckState.Unchecked)\n', '            parent = self.tree.topLevelItem(i)\n            if parent is None:\n                continue\n            parent.setCheckState(0, Qt.CheckState.Unchecked)\n')
          replace("v2/serm_v2/gui/mame_advanced_filters_dialog.py", '                parent.child(j).setCheckState(0, Qt.CheckState.Unchecked)\n', '                child = parent.child(j)\n                if child is not None:\n                    child.setCheckState(0, Qt.CheckState.Unchecked)\n')
          replace("v2/serm_v2/gui/mame_advanced_filters_dialog.py", '        data = item.data(0, Qt.ItemDataRole.UserRole)\n        if not data:\n            return\n        kind, value = data\n', '        data = item.data(0, Qt.ItemDataRole.UserRole)\n        if not isinstance(data, tuple) or len(data) != 2:\n            return\n        kind, value = data\n')
      - name: Validate
        run: python -m compileall -q v2/serm_v2
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/serm_v2
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(v2): corrigir tipos reportados pelo Pylance [skip ci]"
          git push
