name: Temporary Service Pylance Fix

on:
  push:
    paths:
      - .github/workflows/temporary-service-pylance-fix.yml
      - .github/pylance-trigger.txt

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply final typed fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"pattern not found: {path}: {old!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          # Dynamic INI section names are normalized to a concrete string.
          p = Path("v2/serm_v2/services/mame_display_pipeline.py")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              '                key: str = section if section is not None else "__global__"\n',
              '                key: str = str(section) if section else "__global__"\n',
          )
          p.write_text(text, encoding="utf-8")

          # logging.Handler and QObject both expose an emit method with
          # incompatible signatures. Use a composed QObject signal bridge.
          p = Path("v2/serm_v2/gui/log_handler.py")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              'from PySide6.QtCore import QObject, Signal\n\n\nclass QtLogHandler(logging.Handler, QObject):\n',
              'from PySide6.QtCore import QObject, Signal\n\n\nclass _QtLogEmitter(QObject):\n    record_emitted = Signal(str, str)\n\n\nclass QtLogHandler(logging.Handler):\n',
          )
          text = text.replace(
              '    record_emitted = Signal(str, str)\n\n    def __init__(self, max_records: int = 500) -> None:\n        QObject.__init__(self)\n        logging.Handler.__init__(self)\n        self.records: deque[str] = deque(maxlen=max_records)\n',
              '    def __init__(self, max_records: int = 500) -> None:\n        super().__init__()\n        self.records: deque[str] = deque(maxlen=max_records)\n        self.emitter = _QtLogEmitter()\n\n    @property\n    def record_emitted(self):\n        return self.emitter.record_emitted\n',
          )
          text = text.replace(
              '            self.record_emitted.emit(record.levelname, message)\n',
              '            self.emitter.record_emitted.emit(record.levelname, message)\n',
          )
          p.write_text(text, encoding="utf-8")

      - name: Validate syntax
        run: python -m compileall -q v2/serm_v2 v2/tests
      - name: Commit applied fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/serm_v2 v2/tests
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(v2): eliminar ultimos erros de tipagem [skip ci]"
          git push
      - name: Install dependencies and pyright
        run: python -m pip install -e "v2[dev]" pyright
      - name: Validate Pylance-compatible types
        run: pyright v2/serm_v2 v2/tests
