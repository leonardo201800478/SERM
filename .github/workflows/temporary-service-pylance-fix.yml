name: Temporary Service Pylance Fix

on:
  push:
    paths:
      - .github/workflows/temporary-service-pylance-fix.yml

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply typed service fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"pattern not found: {path}: {old!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace("v2/serm_v2/gui/scan_phase_page.py",
              '    def _completed(self, result: object) -> None:\n',
              '    def _completed(self, result: Any) -> None:\n')
          replace("v2/serm_v2/gui/scan_phase_page.py",
              '        completed_result = cast(Any, result)\n        path = ScanRepository(database_path()).raw_file(completed_result.scan_id)\n',
              '        path = ScanRepository(database_path()).raw_file(result.scan_id)\n')
          replace("v2/serm_v2/gui/scan_phase_page.py",
              '        for index in range(self.tabs.count()):\n            widget = self.tabs.widget(index)\n            refresh = getattr(widget, "refresh", None) if widget is not None else None\n            if callable(refresh):\n                refresh()\n',
              '        for index in range(self.tabs.count()):\n            widget = self.tabs.widget(index)\n            if isinstance(widget, _SystemScanTab):\n                widget.refresh()\n')
          replace("v2/serm_v2/gui/scan_phase_page.py", 'from typing import Any, cast\n', 'from typing import Any\n')

          def fix_lastrowid(path, variables):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              for variable in variables:
                  text = text.replace(
                      f'int({variable}.lastrowid)',
                      f'_require_rowid({variable}.lastrowid)',
                  )
              p.write_text(text, encoding="utf-8")

          files = [
              "v2/serm_v2/services/mame_catalog_normalizer.py",
              "v2/serm_v2/services/mame_catalog_service.py",
              "v2/serm_v2/services/mame_classification_service.py",
              "v2/serm_v2/services/mame_display_pipeline.py",
              "v2/serm_v2/services/mame_display_catalog.py",
              "v2/serm_v2/services/mame_display_resolver.py",
              "v2/serm_v2/services/mame_resolution_service.py",
              "v2/serm_v2/services/mame_vsync_service.py",
              "v2/serm_v2/services/whloader_data_service.py",
          ]
          for path in files:
              fix_lastrowid(path, ["cur", "cursor", "row", "import_row"])

          helper = '''\n\ndef _require_rowid(value: int | None) -> int:\n    """Retorna um rowid garantidamente válido após um INSERT."""\n    if value is None:\n        raise RuntimeError("SQLite não retornou lastrowid após INSERT.")\n    return value\n'''
          for path in files:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if "def _require_rowid(" not in text:
                  marker = "\n\n__all__ ="
                  text = text.replace(marker, helper + marker, 1) if marker in text else text + helper
              p.write_text(text, encoding="utf-8")

          replace("v2/serm_v2/services/mame_catalog_normalizer.py",
              '        totals = {\n',
              '        totals: dict[str, int | float] = {\n')
          replace("v2/serm_v2/services/mame_catalog_service.py",
              '            results.append((name, service.ingest(logger=self._log)))\n',
              '            results.append((name, dict(service.ingest(logger=self._log))))\n')
          replace("v2/serm_v2/services/whloader_data_service.py",
              '                hardware = game.get("hardware") if isinstance(game.get("hardware"), dict) else {}\n',
              '                hardware_value = game.get("hardware")\n                hardware: dict[str, Any] = (\n                    hardware_value if isinstance(hardware_value, dict) else {}\n                )\n')
          replace("v2/serm_v2/services/mame_display_resolver.py",
              '            result.append(\n                ExternalDisplayFact(\n                    machine, width, height, refresh, orientation, ax, ay, raw, payload.get("line")\n                )\n            )\n',
              '            line_value = payload.get("line")\n            line_number = line_value if isinstance(line_value, int) else None\n            result.append(\n                ExternalDisplayFact(\n                    machine, width, height, refresh, orientation, ax, ay, raw, line_number\n                )\n            )\n')
          replace("v2/serm_v2/services/emulator_manager.py",
              '                progress and progress(received, total)\n',
              '                if progress:\n                    progress(received, total)\n')

          replace("v2/serm_v2/services/rom_scan_service.py",
              '    @staticmethod\n    def _hash_stream(stream) -> tuple[int, str, str]:\n',
              '    def _hash_stream(self, stream) -> tuple[int, str, str]:\n')
          replace("v2/serm_v2/services/rom_scan_service.py",
              '            chunk = stream.read(RomScanService.CHUNK_SIZE)\n',
              '            chunk = stream.read(self.CHUNK_SIZE)\n')
          replace("v2/serm_v2/services/rom_scan_service.py",
              '    @staticmethod\n    def _crc32(path: Path) -> str:\n',
              '    def _crc32(self, path: Path) -> str:\n')
          replace("v2/serm_v2/services/rom_scan_service.py",
              '    @staticmethod\n    def _sha1(path: Path) -> str:\n',
              '    def _sha1(self, path: Path) -> str:\n')

          replace("v2/serm_v2/services/mame_display_pipeline.py",
              '                result.setdefault(section or "__global__", {})[parts[0].strip()] = parts[1].strip()\n',
              '                key = section or "__global__"\n                result.setdefault(key, {})[parts[0].strip()] = parts[1].strip()\n')

          replace("v2/serm_v2/gui/filter_profiles_page.py",
              '        self._editor_splitter = QSplitter(Qt.Orientation.Vertical)\n        source_box = self._source_box()\n',
              '        editor_splitter = QSplitter(Qt.Orientation.Vertical)\n        self._editor_splitter = editor_splitter\n        source_box = self._source_box()\n')
          replace("v2/serm_v2/gui/filter_profiles_page.py",
              '        self._editor_splitter.addWidget(source_box)\n        self._editor_splitter.addWidget(lower)\n        self._editor_splitter.setStretchFactor(0, 0)\n        self._editor_splitter.setStretchFactor(1, 1)\n        self._editor_splitter.setSizes([145, 650])\n        layout.addWidget(self._editor_splitter, 1)\n',
              '        editor_splitter.addWidget(source_box)\n        editor_splitter.addWidget(lower)\n        editor_splitter.setStretchFactor(0, 0)\n        editor_splitter.setStretchFactor(1, 1)\n        editor_splitter.setSizes([145, 650])\n        layout.addWidget(editor_splitter, 1)\n')
          replace("v2/serm_v2/gui/filter_profiles_page.py",
              '            try:\n                return int(value)\n            except (TypeError, ValueError):\n                return 0\n',
              '            if isinstance(value, bool):\n                return int(value)\n            if isinstance(value, (int, float)):\n                return int(value)\n            if isinstance(value, str):\n                try:\n                    return int(value)\n                except ValueError:\n                    return 0\n            return 0\n')

          replace("v2/tests/test_launchbox_provider.py",
              '    metadata = integration.executable.parent / "Metadata"\n',
              '    executable = integration.executable\n    assert executable is not None\n    metadata = executable.parent / "Metadata"\n')
          replace("v2/tests/test_launchbox_provider.py",
              '    database = integration.executable.parent / "Metadata" / "LaunchBox.Metadata.db"\n',
              '    executable = integration.executable\n    assert executable is not None\n    database = executable.parent / "Metadata" / "LaunchBox.Metadata.db"\n')
          replace("v2/tests/test_launchbox_provider.py",
              '    platforms = integration.executable.parent / "Metadata" / "Platforms.xml"\n',
              '    platforms = executable.parent / "Metadata" / "Platforms.xml"\n')

      - name: Validate syntax
        run: python -m compileall -q v2/serm_v2 v2/tests
      - name: Install project dependencies and pyright
        run: python -m pip install -e "v2[dev]" pyright
      - name: Validate Pylance-compatible types
        run: pyright v2/serm_v2 v2/tests
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/serm_v2 v2/tests
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(v2): corrigir tipagem dos services e scan [skip ci]"
          git push
