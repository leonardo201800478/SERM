name: Temporary Service Pylance Fix

on:
  push:
    paths:
      - .github/workflows/temporary-service-pylance-fix.yml
      - .github/pylance-trigger.txt

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply final parser typing fix
        shell: python
        run: |
          from pathlib import Path
          p = Path("v2/serm_v2/services/mame_display_pipeline.py")
          text = p.read_text(encoding="utf-8")
          old = '            if match:\n                section = match.group(1).strip()\n                result.setdefault(section, {})\n                continue\n'
          new = '            if match:\n                section = match.group(1).strip()\n                section_key: str = str(section)\n                result.setdefault(section_key, {})\n                continue\n'
          if old not in text:
              raise SystemExit("parser section pattern not found")
          p.write_text(text.replace(old, new), encoding="utf-8")
      - name: Validate syntax
        run: python -m compileall -q v2/serm_v2 v2/tests
      - name: Commit applied fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/serm_v2
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(v2): tipar chave de secao do parser de display [skip ci]"
          git push
      - name: Install dependencies and pyright
        run: python -m pip install -e "v2[dev]" pyright
      - name: Validate Pylance-compatible types
        run: pyright v2/serm_v2 v2/tests
