name: Temporary Service Pylance Fix

on:
  push:
    paths:
      - .github/workflows/temporary-service-pylance-fix.yml
      - .github/pylance-trigger.txt

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply typed fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"pattern not found: {path}: {old!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          # Replace every SQLite lastrowid conversion with a checked helper.
          sqlite_files = [
              "v2/serm_v2/services/mame_catalog_normalizer.py",
              "v2/serm_v2/services/mame_catalog_service.py",
              "v2/serm_v2/services/mame_classification_service.py",
              "v2/serm_v2/services/mame_display_pipeline.py",
              "v2/serm_v2/services/mame_display_catalog.py",
              "v2/serm_v2/services/mame_display_resolver.py",
              "v2/serm_v2/services/mame_resolution_service.py",
              "v2/serm_v2/services/mame_vsync_service.py",
              "v2/serm_v2/services/whloader_data_service.py",
          ]
          for name in sqlite_files:
              p = Path(name)
              text = p.read_text(encoding="utf-8")
              text = re.sub(
                  r'int\((cur|cursor|row|import_row)\.lastrowid\)',
                  r'require_lastrowid(\1.lastrowid)',
                  text,
              )
              if "from .sqlite_utils import require_lastrowid" not in text:
                  lines = text.splitlines()
                  insert_at = 0
                  while insert_at < len(lines) and (lines[insert_at].startswith("\"") or lines[insert_at].startswith("from __future__")):
                      insert_at += 1
                  while insert_at < len(lines) and lines[insert_at].startswith(("import ", "from ")):
                      insert_at += 1
                  lines.insert(insert_at, "from .sqlite_utils import require_lastrowid")
                  text = "\n".join(lines) + "\n"
              p.write_text(text, encoding="utf-8")

          # Normalizer totals are intentionally heterogeneous numeric values.
          replace("v2/serm_v2/services/mame_catalog_normalizer.py",
              '        totals = {\n',
              '        totals: dict[str, int | float] = {\n')
          replace("v2/serm_v2/services/mame_catalog_normalizer.py",
              'def _insert_children(\n        self,\n        db: sqlite3.Connection,\n        machine_id: int,\n        machine: ET.Element,\n        totals: dict[str, int | float],\n',
              'def _insert_children(\n        self,\n        db: sqlite3.Connection,\n        machine_id: int,\n        machine: ET.Element,\n        totals: dict[str, int | float],\n') if 'def _insert_children(\n        self,\n        db: sqlite3.Connection,\n        machine_id: int,\n        machine: ET.Element,\n        totals: dict[str, int | float],\n' in Path("v2/serm_v2/services/mame_catalog_normalizer.py").read_text(encoding="utf-8") else None

          # Catalog orchestration result dictionaries are heterogeneous.
          replace("v2/serm_v2/services/mame_catalog_service.py",
              '            results.append((name, service.ingest(logger=self._log)))\n',
              '            results.append((name, dict(service.ingest(logger=self._log))))\n')

          # WHDLoad JSON can contain null/non-dict hardware metadata.
          replace("v2/serm_v2/services/whloader_data_service.py",
              '                hardware = game.get("hardware") if isinstance(game.get("hardware"), dict) else {}\n',
              '                hardware_value = game.get("hardware")\n                hardware: dict[str, Any] = hardware_value if isinstance(hardware_value, dict) else {}\n') if '                hardware = game.get("hardware") if isinstance(game.get("hardware"), dict) else {}\n' in Path("v2/serm_v2/services/whloader_data_service.py").read_text(encoding="utf-8") else None

          # Dynamic display line metadata must be narrowed to int | None.
          replace("v2/serm_v2/services/mame_display_resolver.py",
              '            result.append(\n                ExternalDisplayFact(\n                    machine, width, height, refresh, orientation, ax, ay, raw, payload.get("line")\n                )\n            )\n',
              '            line_value = payload.get("line")\n            line_number = line_value if isinstance(line_value, int) else None\n            result.append(\n                ExternalDisplayFact(\n                    machine, width, height, refresh, orientation, ax, ay, raw, line_number\n                )\n            )\n') if '            result.append(\n                ExternalDisplayFact(\n                    machine, width, height, refresh, orientation, ax, ay, raw, payload.get("line")\n                )\n            )\n' in Path("v2/serm_v2/services/mame_display_resolver.py").read_text(encoding="utf-8") else None

          # Avoid an unused boolean expression in the emulator progress path.
          replace("v2/serm_v2/services/emulator_manager.py",
              '                progress and progress(received, total)\n',
              '                if progress:\n                    progress(received, total)\n') if '                progress and progress(received, total)\n' in Path("v2/serm_v2/services/emulator_manager.py").read_text(encoding="utf-8") else None

          # The resilient scanner overrides instance hashing hooks because they
          # need cooperative cancellation/heartbeat state.
          replace("v2/serm_v2/services/rom_scan_service.py",
              '    @staticmethod\n    def _hash_stream(stream) -> tuple[int, str, str]:\n',
              '    def _hash_stream(self, stream) -> tuple[int, str, str]:\n') if '    @staticmethod\n    def _hash_stream(stream) -> tuple[int, str, str]:\n' in Path("v2/serm_v2/services/rom_scan_service.py").read_text(encoding="utf-8") else None
          text = Path("v2/serm_v2/services/rom_scan_service.py").read_text(encoding="utf-8")
          text = text.replace('stream.read(RomScanService.CHUNK_SIZE)', 'stream.read(self.CHUNK_SIZE)')
          text = text.replace('    @staticmethod\n    def _crc32(path: Path) -> str:\n', '    def _crc32(self, path: Path) -> str:\n')
          text = text.replace('    @staticmethod\n    def _sha1(path: Path) -> str:\n', '    def _sha1(self, path: Path) -> str:\n')
          Path("v2/serm_v2/services/rom_scan_service.py").write_text(text, encoding="utf-8")

          # Display fallback parser: effective section key is always str.
          p = Path("v2/serm_v2/services/mame_display_pipeline.py")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              'result.setdefault(section or "__global__", {})[parts[0].strip()] = parts[1].strip()',
              'key: str = section if section is not None else "__global__"\n                result.setdefault(key, {})[parts[0].strip()] = parts[1].strip()',
          )
          p.write_text(text, encoding="utf-8")

          # Filter estimate accepts JSON/dynamic values.
          p = Path("v2/serm_v2/gui/filter_profiles_page.py")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              '            try:\n                return int(value)\n            except (TypeError, ValueError):\n                return 0\n',
              '            if isinstance(value, bool):\n                return int(value)\n            if isinstance(value, (int, float)):\n                return int(value)\n            if isinstance(value, str):\n                try:\n                    return int(value)\n                except ValueError:\n                    return 0\n            return 0\n',
          )
          p.write_text(text, encoding="utf-8")

          # LaunchBox provider tests narrow the optional executable at use sites.
          p = Path("v2/tests/test_launchbox_provider.py")
          text = p.read_text(encoding="utf-8")
          text = text.replace('    metadata = integration.executable.parent / "Metadata"\n', '    executable = integration.executable\n    assert executable is not None\n    metadata = executable.parent / "Metadata"\n')
          text = text.replace('    database = integration.executable.parent / "Metadata" / "LaunchBox.Metadata.db"\n', '    executable = integration.executable\n    assert executable is not None\n    database = executable.parent / "Metadata" / "LaunchBox.Metadata.db"\n')
          text = text.replace('    platforms = integration.executable.parent / "Metadata" / "Platforms.xml"\n', '    platforms = executable.parent / "Metadata" / "Platforms.xml"\n')
          p.write_text(text, encoding="utf-8")

          # Scan GUI typing.
          p = Path("v2/serm_v2/gui/scan_phase_page.py")
          text = p.read_text(encoding="utf-8")
          text = text.replace('from typing import Any, cast\n', 'from typing import Any\n')
          text = text.replace('    def _completed(self, result: object) -> None:\n', '    def _completed(self, result: Any) -> None:\n')
          text = text.replace('        completed_result = cast(Any, result)\n        path = ScanRepository(database_path()).raw_file(completed_result.scan_id)\n', '        path = ScanRepository(database_path()).raw_file(result.scan_id)\n')
          text = text.replace('        for index in range(self.tabs.count()):\n            widget = self.tabs.widget(index)\n            refresh = getattr(widget, "refresh", None) if widget is not None else None\n            if callable(refresh):\n                refresh()\n', '        for index in range(self.tabs.count()):\n            widget = self.tabs.widget(index)\n            if isinstance(widget, _SystemScanTab):\n                widget.refresh()\n')
          p.write_text(text, encoding="utf-8")

      - name: Validate syntax
        run: python -m compileall -q v2/serm_v2 v2/tests
      - name: Commit applied fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/serm_v2 v2/tests
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(v2): corrigir tipagem dos services e scan [skip ci]"
          git push
      - name: Install dependencies and pyright
        run: python -m pip install -e "v2[dev]" pyright
      - name: Validate Pylance-compatible types
        run: pyright v2/serm_v2 v2/tests
