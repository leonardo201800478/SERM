name: SERM Ruff Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ruff-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install "ruff>=0.12,<1"

      - name: Format V2
        working-directory: v2
        run: ruff format serm_v2 tests

      - name: Fix lint V2
        working-directory: v2
        run: |
          ruff check serm_v2 tests --fix --unsafe-fixes --ignore E741
          python - <<'PY'
          from pathlib import Path
          path = Path("serm_v2/gui/emulator_shaders_bezels_page.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "lambda _=False, e=emulator, l=layer, k=spec.key: self._browse(e, l, k)",
              "lambda _=False, e=emulator, layer_name=layer, k=spec.key: self._browse(e, layer_name, k)",
          )
          text = text.replace(
              "lambda _=False, e=emulator, l=layer: self.save(e, l)",
              "lambda _=False, e=emulator, layer_name=layer: self.save(e, layer_name)",
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate V2
        working-directory: v2
        run: ruff check serm_v2 tests

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "Nenhuma correção Ruff necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/serm_v2 v2/tests
          git commit -m "fix(v2): corrigir problemas reportados pelo Ruff"
          git push
