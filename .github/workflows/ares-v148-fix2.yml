name: ARES v148 firmware cleanup

on:
  push:
    branches: [fix/ares-v148-firmware]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unsupported ARES firmware entry
        run: |
          python - <<'PY'
          from pathlib import Path
          service = Path('serm_v2/services/ares_firmware_service.py')
          text = service.read_text(encoding='utf-8')
          line = '        {"system": "Atari 5200", "name": "BIOS", "region": "NTSC-U Four-port", "sha256": "06b250f18983d058c0f156ce7ee88ae48b6eaf11e6f10f21dccf6ac7ffb6a6af", "source_path": "desktop-ui/emulator/atari-5200.cpp"},\n'
          if line not in text:
              raise SystemExit('Atari 5200 source entry not found')
          service.write_text(text.replace(line, '', 1), encoding='utf-8')
          PY
          rm -f .github/workflows/ares-v148-fix2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ares): remove unsupported Atari 5200 firmware'
          git push origin HEAD:fix/ares-v148-firmware
# retrigger cleanup
