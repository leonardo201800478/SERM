name: ARES v148 firmware cleanup 3

on:
  push:
    branches: [fix/ares-v148-firmware]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unsupported entries
        run: |
          python - <<'PY'
          from pathlib import Path
          service = Path('serm_v2/services/ares_firmware_service.py')
          text = service.read_text(encoding='utf-8')
          lines = text.splitlines(True)
          lines = [line for line in lines if '"system": "Saturn"' not in line and '"system": "Atari 5200"' not in line]
          service.write_text(''.join(lines), encoding='utf-8')
          PY
          rm -f .github/workflows/ares-v148-fix3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ares): remove unsupported Saturn and Atari 5200 firmware'
          git push origin HEAD:fix/ares-v148-firmware
# retrigger
